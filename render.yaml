services:
  - type: web
    name: crazycombat
    runtime: node
    rootDir: ranking-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crazycombat-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: crazycombat-db
    databaseName: crazycombat
    user: crazycombat
    plan: free
