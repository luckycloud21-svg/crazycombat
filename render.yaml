services:
  - type: web
    name: crazycombat
    runtime: node
    rootDir: ranking-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://luckycloud21.itch.io,https://html-classic.itch.zone,https://html.itch.zone
      - key: ITCH_CLIENT_ID
        sync: false
      - key: ITCH_OAUTH_REDIRECT_URI
        sync: false
      - key: AUTH_SECRET
        sync: false
